        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F1115;
            color: #E5E7EB;
        }
        .page-square {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-square:active {
            transform: scale(0.9);
        }
        .page-square.read {
            background-color: #22C55E;
            color: white;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
        }
        .progress-bar-fill {
            transition: width 0.5s ease-out;
        }
        /* Custom scrollbar */

        ::-webkit-scrollbar-track { background: #171A21; }
        ::-webkit-scrollbar-thumb { background: #2A2F3A; border-radius: 4px; }

                    <tbody id="surah-table-body" class="divide-y divide-white/5">
                        <!-- Content injected by JS -->

                </table>
            </div>
        </section>

        <!-- Progress Section -->
        <section class="bg-[#171A21] rounded-2xl border border-white/5 p-8 shadow-2xl space-y-6">

                    0%

            </div>

            <div class="h-4 bg-[#2A2F3A] rounded-full overflow-hidden">
                <div id="progress-bar" class="progress-bar-fill h-full bg-[#22C55E] shadow-[0_0_10px_rgba(34,197,94,0.4)]" style="width: 0%"></div>
            </div>

            <div class="pt-4 flex justify-center">
                <div id="reset-container">
                    <button id="reset-btn" class="flex items-center gap-2 px-6 py-2.5 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white rounded-xl transition-all duration-200 font-medium">

                        إعادة ضبط التقدم
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-12 text-center text-[#9CA3AF] text-sm border-t border-white/5">
        <p>مصحف التهجد — تقبل الله منا ومنكم</p>

            { id: 111, name: "المسد", start: 152, end: 152 },
            { id: 112, name: "الإخلاص", start: 152, end: 152 },
            { id: 113, name: "الفلق", start: 152, end: 152 },
            { id: 114, name: "الناس", start: 152, end: 152 },
        ];

        const TOTAL_PAGES = 152;
        const STORAGE_KEY = 'tahajjud_mushaf_progress_vanilla';

        let progress = {};

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    progress = JSON.parse(saved);
                } catch (e) {
                    console.error("Failed to load progress", e);
                    progress = {};
                }
            }
        }

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            updateStats();
        }

        function togglePage(pageNum) {
            progress[pageNum] = !progress[pageNum];
            const btn = document.querySelector(`[data-page="${pageNum}"]`);
            if (progress[pageNum]) {
                btn.classList.add('read');
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
            } else {
                btn.classList.remove('read');
                btn.innerHTML = pageNum;
            }
            saveProgress();
        }

        function updateStats() {
            const readCount = Object.values(progress).filter(Boolean).length;
            const percentage = Math.round((readCount / TOTAL_PAGES) * 100);
            
            document.getElementById('read-count').textContent = readCount;
            document.getElementById('percentage-text').textContent = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function renderTable() {
            const tbody = document.getElementById('surah-table-body');
            tbody.innerHTML = '';

            SURAHS.forEach(surah => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-white/2 transition-colors';
                
                const tdName = document.createElement('td');
                tdName.className = 'px-6 py-4 font-medium text-lg whitespace-nowrap';
                tdName.textContent = surah.name;
                
                const tdPages = document.createElement('td');
                tdPages.className = 'px-6 py-4';
                
                const grid = document.createElement('div');
                grid.className = 'flex flex-wrap gap-2';
                
                for (let i = surah.start; i <= surah.end; i++) {
                    const btn = document.createElement('button');
                    btn.dataset.page = i;
                    btn.className = 'page-square relative w-10 h-10 md:w-12 md:h-12 rounded-lg flex items-center justify-center text-xs font-mono bg-[#2A2F3A] text-[#9CA3AF] hover:bg-[#3a4150]';
                    btn.title = `صفحة ${i}`;
                    
                    if (progress[i]) {
                        btn.classList.add('read');
                        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
                    } else {
                        btn.textContent = i;
                    }
                    
                    btn.onclick = () => togglePage(i);
                    grid.appendChild(btn);
                }
                
                tdPages.appendChild(grid);
                tr.appendChild(tdName);
                tr.appendChild(tdPages);
                tbody.appendChild(tr);
            });
        }

        function initReset() {
            const container = document.getElementById('reset-container');
            const btn = document.getElementById('reset-btn');
            
            btn.onclick = () => {
                container.innerHTML = `
                    <div class="flex items-center gap-4 animate-in fade-in zoom-in duration-200">
                        <span class="text-sm text-[#9CA3AF]">هل أنت متأكد؟</span>
                        <button id="confirm-reset" class="px-6 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition-colors font-medium">نعم، إعادة الضبط</button>
                        <button id="cancel-reset" class="px-6 py-2 bg-[#2A2F3A] text-white rounded-xl hover:bg-[#3a4150] transition-colors font-medium">إلغاء</button>
                    </div>
                `;
                
                document.getElementById('confirm-reset').onclick = () => {
                    progress = {};
                    saveProgress();
                    renderTable();
                    initReset();
                };
                
                document.getElementById('cancel-reset').onclick = () => {
                    initReset();
                };
            };
        }

        // Initialize
        loadProgress();
        renderTable();
        updateStats();
        initReset();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
